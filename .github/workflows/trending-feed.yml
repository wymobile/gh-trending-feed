name: trending-feed

on:
  schedule:
    - cron: '30 1 * * *'   # daily ~01:30 UTC, after GitHub trending refreshes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SINCE: daily          # daily | weekly | monthly
      LANGUAGE: ""          # optional, e.g. python — empty = all languages
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # raises API rate limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build RSS
        run: python scripts/build_feed.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || { git commit -m "refresh trending feed $(date -u +%F)"; git push; }
